# All versions are pinned. See docs/TECH_STACK.md for the rationale behind each choice.
[versions]
# Matches the Kotlin stdlib line bundled by the baseline platform (IntelliJ 2026.1 -> Kotlin 2.3.20).
kotlin = "2.3.21"
intellijPlatformGradlePlugin = "2.20.1"
# Baseline platform used for compilation and the lowest IDE the plugin declares support for.
intellijPlatform = "2026.1"
mcpSdk = "0.9.0"
# Aligned with the Ktor version the MCP SDK 0.9.0 is built and tested against.
ktor = "3.2.3"
# Aligned with the MCP SDK 0.9.0 requirement; the IDE ships its own copy at runtime.
coroutines = "1.10.2"
serialization = "1.9.0"
mavenArtifact = "3.9.16"
junit = "6.1.3"

[libraries]
mcp-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcpSdk" }
mcp-sdk-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcpSdk" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-cio ={ module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
maven-artifact = { module = "org.apache.maven:maven-artifact", version.ref = "mavenArtifact" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatformGradlePlugin" }
